{% load static %} <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab-Multicolor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
    
    <div class="wrapper">
        <aside>
            <header>
                <h1 class="logo">Lab-Multicolor</h1>
            </header>
            <nav>
                <ul>
                    <li>
                        <a class="boton-menu boton-volver"  href="{% url 'home' %}">
                            <i class="bi bi-cart-dash"></i>Seguir comprando
                        </a>
                    </li>
                    <li>
                        <a class="boton-menu boton-carrito active"  href="{% url 'home' %}">
                            <i class="bi bi-cart-dash"></i>Carrito <span class="numerito">0</span>
                        </a>
                    </li>
                </ul>
            </nav>
            <footer>
                <p class="texto-footer">© 2026 Lab-Multicolor. Todos los derechos reservados.</p>
            </footer>
        </aside>
        <main>
            <h2 class="titulo-principal">Carrito </h2>
            <div class="contenedor-carrito">
                <p class="carrito-vacio">Tu Carrito está vacío <i class="bi bi-emoji-frown"></i></p>
                <div class="carrito-productos">
                    <div class="carrito-productos">
                        <img src="" alt="">
                        <div class="carrito-producto-titulo">
                            <small>Titulo</small>
                            <h3>Nombre del producto</h3>
                        </div>
                        <div class="carrito-producto-cantidad">
                            <small>Cantidad</small>
                            <p>1</p>                            
                        </div>
                        <div class="carrito-producto-precio">
                            <small>Precio</small>
                            <p>$100.00</p>
                        </div>
                        <div class="carrito-producto-subtotal">
                            <small>Subtotal</small>
                            <p>$100.00</p>
                        </div>
                        <button class="carrito-producto-eliminar"><i class="bi bi-trash"></i> Eliminar</button>
                    </div>
                </div>

                <div class="carrito-acciones">
                    <div class="carrito-acciones-izquierda">
                        <button class="carrito-acciones-vaciar">Vaciar Carrito</button>
                    </div>
                    <div class="carrito-acciones-derecha">
                        <div class="carrito-acciones-total">
                            <p>Total:</p>
                            <p id="total">$100</p>
                        </div>
                        <button class="carrito-acciones-comprar">Comprar ahora</button>
                    </div>
                </div>
                
            </div>
        </main>
    </div>
</body>
</html>
